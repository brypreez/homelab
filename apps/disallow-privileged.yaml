apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: check-privileged-containers
    match:
      any:
      - resources:
          kinds:
          - Pod
          - Deployment
          - StatefulSet
          - Job
          - DaemonSet
    validate:
      message: "Privileged containers are strictly forbidden. Security-Sentinel is watching."
      foreach:
      - list: "request.object.spec.template.spec.containers || request.object.spec.containers"
        deny:
          conditions:
            all:
            - key: "{{ element.securityContext.privileged || 'false' }}"
              operator: Equals
              value: true
