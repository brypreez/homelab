apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-test
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: nginx=docker.io/library/nginx
    argocd-image-updater.argoproj.io/nginx.update-strategy: digest
    argocd-image-updater.argoproj.io/nginx.allow-tags: regexp:^stable$
    argocd-image-updater.argoproj.io/write-back-method: kustomize
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default
  source:
    repoURL: git@github.com:brypreez/homelab.git
    targetRevision: HEAD
    path: kubernetes/overlays/prod/nginx-test
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
