apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-test-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:brypreez/homelab.git
    targetRevision: HEAD
    path: kubernetes/overlays/dev/nginx-test
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-dev
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
