apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
- ../../../base/nginx-test
images:
- name: nginx
  newName: docker.io/library/nginx
  newTag: stable
- name: docker.io/nginx
  digest: sha256:42e026ae5315aa0deec22fb00c364fc5ec8d9af1c4833ad5317e2a433e4de0df
patches:
- path: replica-patch.yaml
  target:
    kind: Deployment
    name: nginx-test
- path: resources-patch.yaml
  target:
    kind: Deployment
    name: nginx-test
- path: loadbalancer-patch.yaml
  target:
    kind: Service
    name: nginx-test
