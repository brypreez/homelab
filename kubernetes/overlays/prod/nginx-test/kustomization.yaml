apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - ../../../base/nginx-test
images:
  - name: nginx
    newTag: stable
patches:
  - path: replica-patch.yaml
    target:
      kind: Deployment
      name: nginx-test
  - path: resources-patch.yaml
    target:
      kind: Deployment
      name: nginx-test
  - path: loadbalancer-patch.yaml
    target:
      kind: Service
      name: nginx-test
